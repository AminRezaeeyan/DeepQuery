<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
     
      
      .text-base {
        font-family: 'Montserrat', sans-serif;
        font-weight: 800;
        font-size: 105px;
        letter-spacing: -2px;
      }
    </style>
  </defs>

  <g transform="translate(40, 20)">
    
    <!-- AI Prompt Chevron (>) -->
    <path d="M 10 95 L 45 130 L 10 165" 
          fill="none" 
          stroke="#00E676" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- "Deep" -->
    <text x="85" y="170" class="text-base" fill="#FFFFFF">Deep</text>

    <!-- Magnifier "Q" (moved left) -->
    <g stroke="#00E676" fill="none" stroke-linecap="round">
      <circle cx="359" cy="120" r="32" stroke-width="18" />
      <line x1="362" y1="140" x2="383" y2="175" stroke-width="18" />
    </g>

    <!-- "uery" (moved left to match) -->
    <text x="403" y="170" class="text-base" fill="#00E676">uery</text>
    
  </g>
</svg>