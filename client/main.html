<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Research Assistant</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/chat.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-container">
        <!-- Left Sidebar -->
        <aside class="sidebar sidebar-left" id="leftSidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <img src="assets/images/logo.svg" alt="AI Research Assistant" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PGNpcmNsZSBjeD0iMjAiIGN5PSIyMCIgcj0iMjAiIGZpbGw9IiM0YTU1NjgiLz48L3N2Zz4='">
                </div>
            </div>

            <div class="user-info">
                <div class="user-details">
                    <h3 id="userName">Loading...</h3>
                    <div class="plan-info">
                        <span id="planName">Free Plan</span>
                        <a href="plans.html" class="upgrade-link">Upgrade</a>
                    </div>
                </div>
            </div>

            <div class="chat-actions">
                <button class="new-chat-btn" id="newChatBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                    New Chat
                </button>
                <button class="search-btn" id="searchBtn" aria-label="Search chats">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.35-4.35"/>
                    </svg>
                </button>
            </div>

            <div class="search-box" id="searchBox">
                <input type="text" id="searchInput" placeholder="Search chats...">
                <button class="close-search" id="closeSearch">×</button>
            </div>

            <div class="chat-history" id="chatHistory">
                <div class="loading">Loading chats...</div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <div class="chat-header">
                <!-- Left: Model Selector -->
                <div class="chat-header-left">
                    <div class="custom-select-container" id="modelSelectContainer">
                        <div class="custom-select-trigger" id="modelSelectTrigger">
                            <div class="selected-model-info" id="selectedModelInfo">Loading models...</div>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                        <div class="custom-select-dropdown" id="modelSelectDropdown">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                </div>

                <!-- Middle: Title -->
                <div class="chat-header-center">
                    <h1 id="chatTitle">New Chat</h1>
                </div>

                <!-- Right: Temporary Toggle -->
                <div class="chat-header-right">
                    <div class="temp-chat-wrapper" title="When activated, it won't use long term memory and messages won't be stored.">
                        <span class="temp-label">Temp Chat</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="tempChatToggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer">
               <div class="welcome-screen" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 20px;">
                <img src="assets/images/logo.svg" alt="">
                <p style="font-size: 1.2rem; font-weight: 500;">How can I help with your research today?</p>
                <div class="presets-container">
                    <button class="preset-btn" data-prompt="Summarize the key findings of recent papers on quantum computing.">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
                        <span>Summarize key findings</span>
                    </button>
                    <button class="preset-btn" data-prompt="Explain this complex topic to a general audience.">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/></svg>
                        <span>Explain a complex topic</span>
                    </button>
                    <button class="preset-btn" data-prompt="Draft a literature review outline based on these documents.">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                        <span>Draft literature review</span>
                    </button>
                    <button class="preset-btn" data-prompt="Analyze the methodology of the uploaded text.">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <span>Analyze methodology</span>
                    </button>
                </div>
            </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
    <!-- Message Settings Menu -->
    <div id="msgSettingsMenu" class="settings-menu hidden">
    <div class="settings-header">Message Settings</div>
    
    <div class="settings-row">
        <label>Web Search</label>
        <label class="toggle-switch">
            <input type="checkbox" id="setWebSearch">
            <span class="slider"></span>
        </label>
    </div>
    
    <div class="settings-row">
        <label>Challenge Mode</label>
        <label class="toggle-switch">
            <input type="checkbox" id="setChallenge">
            <span class="slider"></span>
        </label>
    </div>
    
    <div class="settings-row">
        <label>Strict Quote Mode</label>
        <label class="toggle-switch">
            <input type="checkbox" id="setStrictQuote">
            <span class="slider"></span>
        </label>
    </div>
    
    <div class="settings-row">
        <label>Reasoning Depth</label>
        <select id="setReasoning" class="settings-select">
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
        </select>
    </div>
    
    <div class="settings-row">
        <label>Audience Type</label>
        <select id="setAudience" class="settings-select">
            <option value="General" selected>General</option>
            <option value="Expert">Expert</option>
        </select>
    </div>
</div>


    <button class="icon-btn" id="msgSettingsBtn" title="Message Settings">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 15a3 3 0 100-6 3 3 0 000 6z"></path>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"></path>
        </svg>
    </button>
    <button class="icon-btn" id="attachBtn" title="Attach File">
        <!-- Existing SVG inside attachBtn -->
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
    </button>
    <input type="file" id="fileInput" hidden>
    <div id="imagePreview" style="display: none; position: relative; width: 60px; height: 60px; margin-bottom: 10px;">
    <img id="imagePreviewImg" src="" alt="Preview" style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px;">
    <button type="button" onclick="window.app.removeSelectedImage()" style="position: absolute; top: -5px; right: -5px; background: red; color: white; border: none; border-radius: 50%; cursor: pointer; width: 20px; height: 20px; display: flex;justify-content: center;align-items: center;;">×</button>
</div>
    <textarea id="messageInput" placeholder="Ask anything..."></textarea>
    
    <button class="icon-btn send-btn" id="sendBtn" title="Send">
        <!-- Existing SVG inside sendBtn -->
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
</div>

            </div>
        </main>

        <!-- Right Sidebar -->
        <aside class="sidebar sidebar-right" id="rightSidebar">
            <div class="sidebar-header">
                <h3>Documents</h3>
            </div>

            <div class="documents-list" id="documentsList">
                <div class="empty-state">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>
                    </svg>
                    <p>No documents yet</p>
                </div>
            </div>
        </aside>
    </div>

    <script src="js/chat.js"></script>
</body>
</html>
