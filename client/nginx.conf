# The app, the API and the admin share one origin, so no CORS setup is needed.
server {
    listen 80;
    client_max_body_size 25m;  # documents up to DOCUMENT_MAX_UPLOAD_MB (20 MB by default)

    root /usr/share/nginx/html;

    location ~ ^/(api|auth|admin)(/|$) {
        proxy_pass http://server:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Answers stream as JSON lines while the agent works, sometimes for minutes.
        proxy_buffering off;
        proxy_read_timeout 900s;
    }

    # Django admin's CSS and JS, collected by the API container into a shared volume.
    location /static/ {
        alias /static/;
    }

    # The single-page app: unknown paths load index.html.
    location / {
        try_files $uri /index.html;
    }
}
