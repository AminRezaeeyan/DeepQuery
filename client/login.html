<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="assets/css/styles.css"></head>
<body>
    <div class="auth-card">
        <img src="assets/images/logo.svg" class="logo" style="width:100%">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button onclick="handleLogin()">Login</button>
        <div id="g_id_onload" data-client_id="YOUR_ID.apps.googleusercontent.com" data-callback="handleGoogleLogin"> </div>
        <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-text="continue_with" data-shape="rectangular"></div>
        <p style="text-align:center">No account? <a href="register.html" style="color:var(--accent-color)">Sign Up</a></p>
    </div>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
