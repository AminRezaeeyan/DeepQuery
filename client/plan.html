<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Plans</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/plan.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Subscription Plans</h1>
        </header>

        <!-- Current Subscription Section -->
        <section id="current-subscription-section" class="hidden">
            <div class="card current-sub-card">
                <h2>Your Current Plan: <span id="current-plan-name">Loading...</span></h2>
                <p>Status: <span id="current-plan-status"></span></p>
                <p>Valid until: <span id="current-plan-date"></span></p>
            </div>
        </section>

        <!-- Available Plans Section -->
        <section>
            <div id="plans-container" class="plans-grid">
                <!-- Plan cards will be injected here via JS -->
            </div>
        </section>
    </div>

    <script src="js/plan.js"></script>
</body>
</html>
