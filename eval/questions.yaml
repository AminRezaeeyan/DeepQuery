# DeepQuery evaluation set.
#
# Each question runs in a fresh chat: the files in `sources` are uploaded and
# indexed first, `image` (if any) is attached to the message, and web search
# is on only when `web_search` is true. Answers are graded by `grading`:
#   numbers    every listed value must appear (within its absolute tolerance)
#   key_points the grader model checks each point is covered correctly
#   abstain    the answer must say the sources don't contain this
# `cite` lists the sources a good answer cites; `evidence` lists, per source,
# passages that must reach the model for the question to be answerable
# (retrieval is scored on these); `requires` lists the
# capabilities the question needs, so the report can separate missing
# features (e.g. computation, code execution) from bugs.
#
# Paper numbers are from the PDFs in sources/. Answers about the other files
# were computed from them (see tools/generate_sources.py).

- id: q01
  category: paper_fact
  language: en
  question: >
    How many parameters does ReFinED have in total, and how is that number split between
    the RoBERTa-base part and the rest of the model?
  sources: [refined.pdf]
  answer: >
    About 154M parameters: roughly 123M in the RoBERTa-base architecture and about 31M for
    the additional description encoder and output layers.
  grading:
    numbers: [{value: 154, tol: 1}, {value: 123, tol: 1}, {value: 31, tol: 1}]
    key_points:
      - Total of about 154 million parameters
      - About 123 million come from RoBERTa-base
      - About 31 million are the description encoder and output layers
  cite: [refined.pdf]
  evidence:
    refined.pdf: ["approximately 154M parameters"]
  requires: [retrieval]

