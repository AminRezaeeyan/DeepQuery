- id: q25
  category: conflict
  language: en
  question: >
    The attached chart is from our own benchmark. How many times faster than the BLINK
    cross-encoder is ReFinED in it? Is the claim in our lab notes about ReFinED's speed
    supported by our benchmark or by the ReFinED paper?
  sources: [lab_notes.md, refined.pdf]
  image: throughput_chart.png
  answer: >
    In our benchmark ReFinED links 297 mentions per second against 4.9 for the BLINK
    cross-encoder: about 61 times faster. The lab notes claim "about 100x"; that isn't
    supported. The ReFinED paper says it is 60 times faster than the BLINK cross-encoder
    (15 s vs 917 s on AIDA-CoNLL, about 61x), which agrees with our benchmark.
  grading:
    numbers: [{value: 60.6, tol: 0.5}]
    key_points:
      - The chart shows about 61x (297 vs 4.9 mentions per second)
      - The lab notes claim about 100x
      - The ReFinED paper reports about 60x, matching the benchmark, so the 100x claim is wrong
  cite: [lab_notes.md, refined.pdf]
  evidence:
    lab_notes.md: ["about 100x faster"]
    refined.pdf: ["60 times faster than the BLINK cross-encoder"]
  requires: [vision, retrieval, multi_doc, computation, conflict_detection]

