- id: q21
  category: code
  language: en
  question: >
    What does nil_threshold.py print? Would any mention be linked differently under the NIL
    paper's own decision rule?
  sources: [nil_threshold.py, nil-prediction.pdf]
  answer: >
    It prints: "Jaguar (car maker) -> Jaguar Cars", "the birds -> NIL", "Mercury -> NIL",
    "Apple -> Apple Inc.", "phoenix -> Phoenix, Arizona", then "NIL: 2/5". The script links
    only when the best score is strictly greater than 0.5, but the paper's Eq. 10 links when
    the score is greater than or equal to epsilon. "the birds" has a best score of exactly
    0.50, so under the paper's rule it links to "The Birds (film)" and only 1 of 5 is NIL.
  grading:
    key_points:
      - The output links Jaguar to Jaguar Cars, Apple to Apple Inc. and phoenix to Phoenix, Arizona
      - '"the birds" and "Mercury" go to NIL, and the last line is "NIL: 2/5"'
      - The script uses a strict > while the paper uses >= epsilon
      - Under the paper's rule "the birds" (score exactly 0.50) links to The Birds (film), leaving 1/5 NIL
  cite: [nil_threshold.py, nil-prediction.pdf]
  evidence:
    nil_threshold.py: ["if score > epsilon"]
    nil-prediction.pdf: ["nil threshold ϵ = 0.5"]
  requires: [retrieval, code_reasoning, multi_doc]

- id: q22
  category: code
  language: en
  question: >
    What does recall_at_k.py print? Are those values correct?
  sources: [recall_at_k.py]
  answer: >
    It prints "R@1 = 0.20", "R@10 = 0.55" and "R@64 = 0.85". They are too high: the ranks are
    0-based, so recall@k should count r < k, but the code uses r <= k and counts one extra
    position. The correct values are 0.15, 0.50 and 0.80.
  grading:
    numbers: [{value: 0.2, tol: 0}, {value: 0.55, tol: 0}, {value: 0.85, tol: 0}, {value: 0.15, tol: 0}, {value: 0.5, tol: 0}, {value: 0.8, tol: 0}]
    key_points:
      - It prints R@1 = 0.20, R@10 = 0.55 and R@64 = 0.85
      - There's an off-by-one bug: ranks are 0-based, so the condition should be r < k
      - The correct values are 0.15, 0.50 and 0.80
  cite: [recall_at_k.py]
  evidence:
    recall_at_k.py: ["r <= k"]
  requires: [retrieval, code_reasoning, computation]

