- id: q04
  category: paper_fact
  language: en
  question: >
    Which NIL threshold (epsilon) and lambda does the NIL prediction paper use for CLINK on
    NEL, and which values does it use on AIDA without NIL, MSNBC and WNED-WIKI? Why would
    epsilon differ between the two settings?
  sources: [nil-prediction.pdf]
  answer: >
    On NEL (and AIDA with NIL): epsilon = 0.5 and lambda = 0.5. On AIDA w/o NIL, MSNBC and
    WNED-WIKI: epsilon = 0 and lambda = 0.9. Those datasets have no NIL mentions to predict,
    so a threshold of 0 means the model always links to its best candidate.
  grading:
    key_points:
      - On NEL, epsilon is 0.5 and lambda is 0.5
      - On AIDA w/o NIL, MSNBC and WNED-WIKI, epsilon is 0 and lambda is 0.9
      - Epsilon 0 means always linking, because those datasets have no NIL mentions
  cite: [nil-prediction.pdf]
  evidence:
    nil-prediction.pdf: ["AIDA w/o NIL, MSNBC & WNED-WIKI"]
  requires: [retrieval, table_reading]

- id: q05
  category: paper_fact
  language: en
  question: >
    In BLINK's approximate-search experiments with FAISS, how many times faster per query is
    HNSW2 than exact search, and how much accuracy and Recall@100 does it give up?
  sources: [blink.pdf]
  answer: >
    9.2 ms vs 1.4 ms per query, about 6.6 times faster. Accuracy drops from 71.5 to 70.7
    (0.8 points) and Recall@100 from 96.7 to 94.6 (2.1 points).
  grading:
    numbers: [{value: 6.6, tol: 0.1}, {value: 0.8, tol: 0.05}, {value: 2.1, tol: 0.05}]
    key_points:
      - Exact search takes 9.2 ms per query and HNSW2 1.4 ms, about 6.6x faster
      - Accuracy falls by 0.8 points (71.5 to 70.7)
      - Recall@100 falls by 2.1 points (96.7 to 94.6)
  cite: [blink.pdf]
  evidence:
    blink.pdf: ["HNSW2 70.7 91.0 93.9 94.6 1.4"]
  requires: [retrieval, table_reading, computation]

- id: q06
  category: cross_paper
  language: en
  question: >
    BLINK and ReFinED both report results on the WikilinksNED Unseen-Mentions test set.
    What is the best number each paper reports there, how far apart are they, and is the
    comparison fair?
  sources: [blink.pdf, refined.pdf]
  answer: >
    BLINK's best is 76.8 accuracy (trained on Wikipedia and in-domain data); ReFinED reports
    66.5 total ED accuracy (61.6 seen, 68.2 unseen), 10.3 points lower. Not a like-for-like
    comparison: BLINK's best uses in-domain fine-tuning (75.2 with Wikipedia only), while
    ReFinED reports it as a zero-shot ED experiment.
  grading:
    numbers: [{value: 76.8, tol: 0.05}, {value: 66.5, tol: 0.05}, {value: 10.3, tol: 0.1}]
    key_points:
      - BLINK's best result is 76.8 (Wikipedia + in-domain training)
      - ReFinED reports 66.5 total accuracy
      - The gap is about 10.3 points in BLINK's favour
      - The setups differ (BLINK fine-tuned in-domain vs ReFinED's zero-shot setting), so the comparison isn't like-for-like
  cite: [blink.pdf, refined.pdf]
  evidence:
    blink.pdf: ["Ours Wiki and in-domain 76.8"]
    refined.pdf: ["ReFinED 61.6 68.2 66.5"]
  requires: [retrieval, multi_doc, table_reading, computation]

- id: q07
  category: cross_paper
  language: en
  question: >
    BLINK's performance on AIDA appears in both the ReFinED paper and the NIL prediction
    paper. What numbers does each paper give for BLINK on AIDA, and why do they differ?
  sources: [refined.pdf, nil-prediction.pdf]
  answer: >
    ReFinED's Table 1 lists Wu et al. (2020) at 86.7 on AIDA, marked as normalised accuracy.
    The NIL paper reports BLINK-cross at 87.49 and BLINK-bi at 82.61 overall accuracy on AIDA
    without NIL (and 79.58 / 65.01 with NIL). They differ because of the metric (normalised
    accuracy vs overall accuracy), the training (the NIL paper trains its own BLINK models
    with BERT-large on AIDA-train), and whether NIL mentions are included.
  grading:
    numbers: [{value: 86.7, tol: 0.05}, {value: 87.49, tol: 0.01}]
    key_points:
      - ReFinED reports 86.7 for Wu et al. (2020) on AIDA, as normalised accuracy
      - The NIL paper reports BLINK-cross at 87.49 on AIDA without NIL (BLINK-bi 82.61)
      - The NIL paper also reports lower numbers with NIL mentions included (79.58 cross, 65.01 bi)
      - Differences come from the metric, the training setup and NIL handling
  cite: [refined.pdf, nil-prediction.pdf]
  evidence:
    refined.pdf: ["86.7 90.3 88.9"]
    nil-prediction.pdf: ["BLINK-cross 84.09 88.89 85.70 83.08 45.16 79.58 87.49"]
  requires: [retrieval, multi_doc, table_reading]

- id: q08
  category: cross_paper
  language: en
  question: >
    Do the BLINK paper and the NIL prediction paper reach the same conclusion about
    bi-encoders versus cross-encoders? Support the answer with specific numbers from both.
  sources: [blink.pdf, nil-prediction.pdf]
  answer: >
    Partly. BLINK finds the cross-encoder more accurate (TACKBP-2010: 94.5 vs 92.9 for the
    bi-encoder alone). The NIL paper agrees on overall accuracy (e.g. CLINK-cross 87.71 vs
    CLINK-bi 79.25 on NEL) but finds bi-encoders strong at detecting NIL mentions: BLINK-bi
    has the best NIL accuracy on AIDA with NIL (69.59 vs 45.16 for BLINK-cross) and 88.59 on
    NEL, close to CLINK-cross's 89.19, suggesting cross-encoders may overfit.
  grading:
    key_points:
      - BLINK finds the cross-encoder more accurate than the bi-encoder (e.g. 94.5 vs 92.9 on TACKBP-2010)
      - The NIL paper also finds cross-encoders better in overall accuracy
      - The NIL paper finds bi-encoders strong at NIL detection (BLINK-bi 69.59 vs BLINK-cross 45.16 NIL accuracy on AIDA with NIL)
      - The NIL paper suggests cross-encoders may be more prone to overfitting
  cite: [blink.pdf, nil-prediction.pdf]
  evidence:
    blink.pdf: ["Ours (bi-encoder only) 92.9"]
    nil-prediction.pdf: ["BLINK-bi 72.27 88.59 77.74 64.54 69.59"]
  requires: [retrieval, multi_doc, synthesis]

- id: q09
  category: cross_paper
  language: en
  question: >
    How large are the entity type systems used by ReFinED and by CLINK, and why does the NIL
    paper use two different type systems?
  sources: [refined.pdf, nil-prediction.pdf]
  answer: >
    ReFinED uses 1,400 entity types. CLINK uses 187 distinct types on NEL and only 14
    top-level types on the traditional datasets, because the type distribution may differ
    across datasets and fewer, coarser types make CLINK more transferable.
  grading:
    numbers: [{value: 1400, tol: 0}, {value: 187, tol: 0}, {value: 14, tol: 0}]
    key_points:
      - ReFinED uses 1,400 entity types
      - CLINK uses 187 types on NEL
      - CLINK uses 14 top-level types on traditional datasets, to transfer better across datasets
  cite: [refined.pdf, nil-prediction.pdf]
  evidence:
    refined.pdf: ["# entity types 1400"]
    nil-prediction.pdf: ["187 distinct types"]
  requires: [retrieval, multi_doc]

- id: q10
  category: calculation
  language: en
  question: >
    The ReFinED paper says the deployment processed a billion web pages in "27k machine hours
    (2 days using 500 instances)". Do those numbers agree? Also, how many mentions did each
    machine link per hour on average?
  sources: [refined.pdf]
  answer: >
    Not exactly: 500 instances for 2 days is 24,000 machine hours, not 27,000 (27,000 hours on
    500 instances is 54 hours, about 2.25 days). With 25 billion mentions in 27,000 machine
    hours, each machine linked about 926,000 mentions per hour (about 257 per second).
  grading:
    numbers: [{value: 24000, tol: 0}, {value: 925926, tol: 2000}]
    key_points:
      - 500 instances x 48 hours = 24,000 machine hours, so the figures don't quite match 27k (27k hours would take about 2.25 days)
      - The deployment linked 25 billion mentions
      - About 926,000 mentions per machine hour (about 257 per second)
  cite: [refined.pdf]
  evidence:
    refined.pdf: ["27k machine hours"]
  requires: [retrieval, computation]

- id: q11
  category: calculation
  language: en
  question: >
    Using ReFinED's inference-time table, what is ReFinED's throughput in mentions per second
    on the AIDA-CoNLL test set, and how long does the BLINK bi-encoder take per mention? How
    does that compare with the 9.2 ms per query reported in the BLINK paper?
  sources: [refined.pdf, blink.pdf]
  answer: >
    The test set has 4,464 mentions. ReFinED takes 15 s: about 298 mentions per second. The
    BLINK bi-encoder takes 93 s: about 20.8 ms per mention. BLINK's 9.2 ms is only the FAISS
    exact-search retrieval of the top 100 candidates per query (on CPU, WikilinksNED), not the
    full end-to-end pipeline ReFinED timed, so the numbers measure different things.
  grading:
    numbers: [{value: 297.6, tol: 1}, {value: 20.8, tol: 0.2}]
    key_points:
      - ReFinED processes about 298 mentions per second (4,464 mentions in 15 s)
      - The BLINK bi-encoder takes about 20.8 ms per mention (93 s / 4,464)
      - BLINK's 9.2 ms measures candidate retrieval only, so it isn't the same measurement
  cite: [refined.pdf, blink.pdf]
  evidence:
    refined.pdf: ["ReFinED 15 89.4"]
    blink.pdf: ["9.2 ms on average"]
  requires: [retrieval, multi_doc, computation]

